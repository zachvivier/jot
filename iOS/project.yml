# Generates Jot.xcodeproj. Run `xcodegen` in this folder after adding or removing files.
name: Jot
options:
  bundleIdPrefix: io.github.zachvivier
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: WYNKR26X4S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jot:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../Shared
      - Resources
      - ../AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zachvivier.jot
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
